---
- ansible.builtin.import_tasks: check_vars.yml

- ansible.builtin.import_tasks: download.yml
  tags:
    - download

- ansible.builtin.import_tasks: dependencies.yml
  tags:
    - install

- ansible.builtin.import_tasks: install.yml
  tags:
    - install

- ansible.builtin.import_tasks: server.yml
  when: not redis_sentinel
  tags:
    - config

- ansible.builtin.import_tasks: sentinel.yml
  when: redis_sentinel
  tags:
    - config

- ansible.builtin.import_tasks: local_facts.yml
  when: redis_local_facts|bool
